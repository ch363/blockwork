<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <title>Blockwork</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14171c;
        color: #e6e9ef;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #root {
        position: relative;
        height: 100%;
      }
      #root canvas {
        display: block;
      }
      /*
       * Boot failures only. Everything else is styled by the shell stylesheet
       * the UI package injects; this has to work before that has run.
       */
      .bw-boot-error {
        margin: 0;
        padding: 24px;
        color: #e05c5c;
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
